openapi: 3.1.0
info:
  title: warehouse-service API
  version: 1.0.0
  description: |
    HTTP API for the warehouse inventory service.

    Public endpoints live under `/api/v1`. The infrastructure endpoints
    `/healthz` and `/readyz` are not versioned.

    The handlers in `api/internal/httpapi/v1` and `api/internal/health` are
    the source of truth; this file describes them and must be updated in the
    same change as any handler that alters the contract.

    Requests that match no route get the standard library's plain-text
    `404 page not found`, and a known path called with the wrong method gets a
    plain-text `405 Method Not Allowed` with an `Allow` header. Neither is a
    JSON error body.

    Identity (POC): a caller names themselves with the `X-Dev-User` header
    (see the `devUser` security scheme). Every `/api/v1` route resolves the
    header, so on any of them a header that names no active user gets
    `401 {"error": "unknown dev user"}`, and a failed lookup gets
    `500 {"error": "internal error"}`. `/healthz` and `/readyz` ignore the
    header. Without the header a request carries no identity. Endpoints
    whose security lists only `devUser` need one (401 without it);
    endpoints that also list `{}` (no security) serve anonymous callers.
    Real authentication replaces this in EP07.

    Admin endpoints live under `/api/v1/admin`.
servers:
  - url: /
    description: Same origin as this document; locally the compose stack serves it on http://localhost:8080
# No authentication by default. Endpoints that need to know the caller
# declare the devUser scheme (POC identity mode) themselves.
security: []
tags:
  - name: products
    description: The product catalog. Creating and updating products is admin only.
  - name: health
    description: Liveness and readiness probes for container runtimes and load balancers
paths:
  /api/v1/products:
    get:
      operationId: listProducts
      summary: List and search products
      description: |
        Returns one page of the catalog, ordered by `name` and then `id`,
        optionally filtered by a name search (`q`) and a category. No
        identity is needed: the `X-Dev-User` header is optional, and a
        request without it is served as an anonymous, non-admin caller.
        Only active products are listed unless an admin sets
        `include_inactive=true`.

        Paging is by cursor: pass a response's `next_cursor` back as
        `cursor`, with the same filters, to get the next page. `next_cursor`
        is null on the last page. Each page starts after the last product
        of the previous one, so changes between requests don't shift
        pages: a product added or renamed meanwhile is listed only if it
        now sorts after the cursor (a renamed one can appear twice).

        Checks run in this order: a header that is sent must name an active
        user (401); the query string must parse, and `limit`,
        `include_inactive` and `cursor`, when present, must be well-formed
        (400); `include_inactive=true` needs an admin (403); then `limit`
        must be in range and `q` and `category` within their limits (400).
        Unknown query parameters are ignored, and only the first value of
        a repeated parameter is used.
      tags: [products]
      security:
        - {}
        - devUser: []
      parameters:
        - name: q
          in: query
          description: |
            Lists products whose name contains this text, ignoring case.
            Matched literally: `%`, `_` and `\` are not wildcards. Trimmed;
            empty or blank means no name filter. At most 200 characters
            after trimming; must not contain U+0000.
          schema:
            type: string
            maxLength: 200
          example: pallet
        - name: category
          in: query
          description: |
            Lists products in exactly this category (case-sensitive; not a
            substring match). Trimmed; empty or blank means any category,
            including uncategorized products. At most 100 characters after
            trimming; must not contain U+0000.
          schema:
            type: string
            maxLength: 100
          example: Handling
        - name: include_inactive
          in: query
          description: |
            `true` also lists inactive products; admins only (403 for
            anyone else, including anonymous callers). Only `true` and
            `false` are accepted.
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: The most products to return on this page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          description: |
            The `next_cursor` of the previous page, passed back unchanged.
            Opaque: clients must not build or edit cursors. Omit it for the
            first page.
          schema:
            type: string
          example: NDI6UGFsbGV0IGphY2s
      responses:
        '200':
          description: One page of products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
              examples:
                morePages:
                  summary: A page with more after it
                  value:
                    items:
                      - id: 42
                        sku: '000123'
                        name: Pallet jack
                        description: Manual, 2500 kg capacity
                        category: Handling
                        total_quantity: 140
                        active: true
                        created_at: '2026-10-22T01:14:50.123456Z'
                        updated_at: '2026-10-22T01:14:50.123456Z'
                    next_cursor: NDI6UGFsbGV0IGphY2s
                lastPage:
                  summary: The last page
                  value:
                    items: []
                    next_cursor: null
        '400':
          description: |
            The query string doesn't parse, a parameter is malformed, or a
            filter breaks a rule. Rule violations name the parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidQueryString:
                  summary: The query string can't be decoded (e.g. a bad percent escape or a semicolon)
                  value:
                    error: invalid query string
                invalidLimit:
                  summary: limit is not an integer
                  value:
                    error: invalid limit
                limitOutOfRange:
                  value:
                    error: limit must be between 1 and 100
                invalidIncludeInactive:
                  summary: include_inactive is neither true nor false
                  value:
                    error: invalid include_inactive
                invalidCursor:
                  summary: cursor is not one this API returned
                  value:
                    error: invalid cursor
                queryTooLong:
                  value:
                    error: q must be at most 200 characters
                categoryTooLong:
                  value:
                    error: category must be at most 100 characters
                nulCharacter:
                  summary: q or category contains U+0000
                  value:
                    error: q must not contain NUL characters
        '401':
          description: |
            An `X-Dev-User` header was sent but names no active user (from
            the identity middleware). Omitting the header is not an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: unknown dev user
        '403':
          description: |
            `include_inactive=true` was sent by a caller who is not an admin
            (a non-admin user or an anonymous caller).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: admin role required
        '500':
          description: |
            The products could not be loaded, or the `X-Dev-User` lookup
            failed. Internal details are logged, never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error
  /api/v1/products/{id}:
    get:
      operationId: getProduct
      summary: Get a product by id
      description: |
        Returns one product by its numeric id. No identity is needed: the
        `X-Dev-User` header is optional, and a request without it is served
        as an anonymous, non-admin caller. Inactive products are only
        visible to admins: non-admins and anonymous callers get the same
        `404 product not found` as for an id that doesn't exist.

        Checks run in this order: a header that is sent must name an active
        user (401), then the id must be valid (400), then the product must
        exist and be visible to the caller (404).
      tags: [products]
      security:
        - {}
        - devUser: []
      parameters:
        - $ref: '#/components/parameters/ProductID'
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 42
                sku: '000123'
                name: Pallet jack
                description: Manual, 2500 kg capacity
                category: Handling
                total_quantity: 140
                active: true
                created_at: '2026-10-22T01:14:50.123456Z'
                updated_at: '2026-10-22T01:14:50.123456Z'
        '400':
          description: |
            The id in the path is not a positive integer of at most
            9223372036854775807 written in ASCII digits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid product id
        '401':
          description: |
            An `X-Dev-User` header was sent but names no active user (from
            the identity middleware). Omitting the header is not an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: unknown dev user
        '404':
          description: |
            No product has this id, or the product is inactive and the caller
            is not an admin (a non-admin user or an anonymous caller).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: product not found
        '500':
          description: |
            The product could not be loaded, or the `X-Dev-User` lookup
            failed. Internal details are logged, never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error
  /api/v1/admin/products:
    post:
      operationId: createProduct
      summary: Create a product
      description: |
        Adds a product to the catalog. Admins only. A new product starts
        active with `total_quantity` units owned (0 if omitted). Stock
        changes only through stock adjustments, so when `total_quantity` is
        above 0 the product is created together with an "Initial stock"
        adjustment of that many units by the caller, atomically; at 0 no
        adjustment is recorded. `name` and `category` are trimmed, and an
        empty or blank `category` means uncategorized.

        Checks run in this order: the caller must be identified (401); the
        body must be a single JSON object of at most 64 KiB (413) with only
        the documented fields and a valid SKU (400); the caller must be an
        admin (403); then the product rules apply (400) and the SKU must be
        unused (409). So a non-admin gets 403 for any request whose body
        decodes and has a valid SKU, whatever its other field values. The
        `Content-Type` header is not checked; the body is always parsed as
        JSON.
      tags: [products]
      security:
        - devUser: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
            examples:
              full:
                summary: Every field
                value:
                  sku: '000123'
                  name: Pallet jack
                  description: Manual, 2500 kg capacity
                  total_quantity: 4
                  category: Handling
              minimal:
                summary: Required fields only
                value:
                  sku: '123456'
                  name: Shrink wrap
      responses:
        '201':
          description: The product was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 42
                sku: '000123'
                name: Pallet jack
                description: Manual, 2500 kg capacity
                category: Handling
                total_quantity: 4
                active: true
                created_at: '2026-10-22T01:14:50.123456Z'
                updated_at: '2026-10-22T01:14:50.123456Z'
        '400':
          description: |
            The body is not a single JSON object matching
            `CreateProductRequest` (malformed JSON, an unknown field, a wrong
            type, or data after the object), the SKU is invalid, or a field
            breaks a product rule. Rule violations name the field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidBody:
                  summary: Malformed JSON, unknown field, wrong type or trailing data
                  value:
                    error: invalid request body
                invalidSKU:
                  summary: SKU missing or not six digits
                  value:
                    error: invalid SKU
                nameRequired:
                  summary: Name missing or blank
                  value:
                    error: name is required
                nameTooLong:
                  value:
                    error: name must be at most 200 characters
                descriptionTooLong:
                  value:
                    error: description must be at most 2000 characters
                categoryTooLong:
                  value:
                    error: category must be at most 100 characters
                nulCharacter:
                  summary: A text field contains U+0000 (name, description or category)
                  value:
                    error: name must not contain NUL characters
                totalQuantityOutOfRange:
                  value:
                    error: total_quantity must be between 0 and 2147483647
        '401':
          description: |
            No `X-Dev-User` header was sent, or it names no active user
            (`unknown dev user`, from the identity middleware).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noIdentity:
                  summary: No X-Dev-User header
                  value:
                    error: authentication required
                unknownUser:
                  summary: X-Dev-User names no active user
                  value:
                    error: unknown dev user
        '403':
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: admin role required
        '409':
          description: A product with this SKU already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: product with this SKU already exists
        '413':
          description: The request body is larger than 64 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: request body too large
        '500':
          description: |
            The product could not be created, or the `X-Dev-User` lookup
            failed. Internal details are logged, never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error
  /api/v1/admin/products/{id}:
    patch:
      operationId: updateProduct
      summary: Update a product's details
      description: |
        Changes a product's `name`, `description` or `category`. Admins
        only; inactive products can be updated too. A field the body leaves
        out is unchanged, and at least one field must be sent. `name` and
        `category` are trimmed as on create; a `null`, empty or blank
        `category` clears it (uncategorized). `name` and `description` may
        not be `null`. `updated_at` is set to the time of the update.

        Stock can't be changed here: `total_quantity` only changes through
        stock adjustments, so a body that contains it, with any value, gets
        a 400 that says so. Other fields of `Product` (`sku`, `active`, ...)
        are unknown fields and get `invalid request body`.

        Checks run in this order: the caller must be identified (401); the
        id must be valid (400); the body must be a single JSON object of at
        most 64 KiB (413) with only the documented fields, no
        `total_quantity` and no null `name` or `description` (400); the
        caller must be an admin (403); then at least one field must be sent
        and the product rules apply (400), and the product must exist
        (404). So a non-admin gets 403 for any request that passes the
        shape checks (a valid id, a body that decodes, no `total_quantity`
        and no null `name` or `description`), whatever its other field
        values. The
        `Content-Type` header is not checked; the body is always parsed as
        JSON.
      tags: [products]
      security:
        - devUser: []
      parameters:
        - $ref: '#/components/parameters/ProductID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
            examples:
              rename:
                summary: Change the name only
                value:
                  name: Hand pallet truck
              full:
                summary: Every field
                value:
                  name: Hand pallet truck
                  description: Manual, 2500 kg capacity
                  category: Handling
              clearCategory:
                summary: Make the product uncategorized
                value:
                  category: null
      responses:
        '200':
          description: The product was updated. The body is the whole product after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 42
                sku: '000123'
                name: Hand pallet truck
                description: Manual, 2500 kg capacity
                category: Handling
                total_quantity: 140
                active: true
                created_at: '2026-10-22T01:14:50.123456Z'
                updated_at: '2026-10-22T02:44:50.654321Z'
        '400':
          description: |
            The id is not a positive integer of at most 9223372036854775807
            written in ASCII digits; the body is not a single JSON object
            matching `UpdateProductRequest` (malformed JSON, an unknown
            field, a wrong type, or data after the object); the body tries
            to change `total_quantity`; `name` or `description` is `null`;
            the body sets no field; or a field breaks a product rule. Rule
            violations name the field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidID:
                  summary: Id is not a positive integer
                  value:
                    error: invalid product id
                invalidBody:
                  summary: Malformed JSON, unknown field, wrong type or trailing data
                  value:
                    error: invalid request body
                totalQuantity:
                  summary: The body contains total_quantity
                  value:
                    error: "total_quantity can't be changed here; use stock adjustments"
                nullName:
                  value:
                    error: name must not be null
                nullDescription:
                  value:
                    error: description must not be null
                noFields:
                  summary: None of name, description and category was sent
                  value:
                    error: no fields to update
                nameBlank:
                  summary: Name empty or blank
                  value:
                    error: name must not be blank
                nameTooLong:
                  value:
                    error: name must be at most 200 characters
                descriptionTooLong:
                  value:
                    error: description must be at most 2000 characters
                categoryTooLong:
                  value:
                    error: category must be at most 100 characters
                nulCharacter:
                  summary: A text field contains U+0000 (name, description or category)
                  value:
                    error: name must not contain NUL characters
        '401':
          description: |
            No `X-Dev-User` header was sent, or it names no active user
            (`unknown dev user`, from the identity middleware).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noIdentity:
                  summary: No X-Dev-User header
                  value:
                    error: authentication required
                unknownUser:
                  summary: X-Dev-User names no active user
                  value:
                    error: unknown dev user
        '403':
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: admin role required
        '404':
          description: No product has this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: product not found
        '413':
          description: The request body is larger than 64 KiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: request body too large
        '500':
          description: |
            The product could not be updated, or the `X-Dev-User` lookup
            failed. Internal details are logged, never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal error
  /healthz:
    get:
      operationId: getLiveness
      summary: Liveness probe
      description: |
        Returns 200 whenever the process can respond. It never checks
        dependencies, so a database outage does not get healthy instances
        restarted.
      tags: [health]
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: |
        Returns 200 when the instance should receive traffic. Returns 503
        until startup finishes, once graceful shutdown begins, and whenever a
        dependency check (currently `postgres`, a database ping) fails.
        Dependency checks are capped at 2 seconds in total.
      tags: [health]
      responses:
        '200':
          description: Ready for traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ready
        '503':
          description: |
            Not ready. `failed` names the dependency check that failed; it is
            absent when the instance is starting up or shutting down. The
            underlying error is only logged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                startingOrDraining:
                  summary: Starting up or shutting down
                  value:
                    status: not ready
                dependencyFailed:
                  summary: A dependency check failed
                  value:
                    status: not ready
                    failed: postgres
components:
  securitySchemes:
    devUser:
      type: apiKey
      in: header
      name: X-Dev-User
      description: |
        POC identity mode: the email of an active user, matched
        case-insensitively. The API trusts it as is, so it refuses to start
        with `APP_ENV=production`. Real authentication replaces this in EP07.
  parameters:
    ProductID:
      name: id
      in: path
      required: true
      description: Product id (`Product.id`), a positive integer.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 42
  schemas:
    SKU:
      type: string
      description: Stock keeping unit. Exactly 6 digits; leading zeros are significant.
      pattern: '^[0-9]{6}$'
      minLength: 6
      maxLength: 6
      examples:
        - '123456'
        - '004210'
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [sku, name]
      properties:
        sku:
          $ref: '#/components/schemas/SKU'
        name:
          type: string
          description: Display name. Trimmed; must not be blank. At most 200 characters after trimming.
          maxLength: 200
          examples:
            - Pallet jack
        description:
          type: string
          description: Free-text description. Defaults to empty. Not trimmed.
          maxLength: 2000
          default: ''
        category:
          type: [string, 'null']
          description: Category name, trimmed. Omitted, null, empty or blank means uncategorized.
          maxLength: 100
          examples:
            - Handling
        total_quantity:
          type: [integer, 'null']
          description: |
            Number of units the warehouse owns. Omitted, null and 0 mean the
            same: no stock and no adjustment. Above 0, the product is created with
            an "Initial stock" stock adjustment of this many units by the
            caller.
          minimum: 0
          maximum: 2147483647
          default: 0
          examples:
            - 40
    UpdateProductRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        A partial update: a field left out is unchanged. `total_quantity`
        is not accepted (400); stock changes only through stock adjustments.
      properties:
        name:
          type: string
          description: Display name. Trimmed; must not be blank. At most 200 characters after trimming.
          maxLength: 200
          examples:
            - Hand pallet truck
        description:
          type: string
          description: Free-text description; empty clears it. Not trimmed.
          maxLength: 2000
        category:
          type: [string, 'null']
          description: Category name, trimmed. Null, empty or blank clears it (uncategorized).
          maxLength: 100
          examples:
            - Handling
    Product:
      type: object
      additionalProperties: false
      required: [id, sku, name, description, category, total_quantity, active, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          description: Product id, assigned by the server.
          examples:
            - 42
        sku:
          $ref: '#/components/schemas/SKU'
        name:
          type: string
          examples:
            - Pallet jack
        description:
          type: string
          description: Empty when none was given.
        category:
          type: [string, 'null']
          description: Null when the product is uncategorized.
          examples:
            - Handling
        total_quantity:
          type: integer
          minimum: 0
          description: Units the warehouse owns, including any that are rented out. For a new product, the `total_quantity` it was created with. It changes only through stock adjustments, never through a product update.
        active:
          type: boolean
          description: Inactive products are hidden from normal use rather than deleted. New products are active.
        created_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp in UTC.
        updated_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp in UTC.
    ProductList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: The page's products, ordered by name and then id. Empty when nothing matches.
          items:
            $ref: '#/components/schemas/Product'
        next_cursor:
          type: [string, 'null']
          description: |
            Pass as `cursor` to get the next page. Null on the last page.
            Opaque; it may change format between releases.
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          description: Short, client-safe description of what went wrong.
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready, not ready]
          description: '`ok` from /healthz; `ready` or `not ready` from /readyz.'
        failed:
          type: string
          description: Name of the dependency check that failed. Only present on a 503 from /readyz caused by a failing check.
          examples:
            - postgres
